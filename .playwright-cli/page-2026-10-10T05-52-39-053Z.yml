- main [ref=e2]:
  - region [ref=e3]:
    - text: 처음 한 번만 설정해 주세요
    - heading "계정 동기화를 준비해요" [level=1] [ref=e4]
    - paragraph [ref=e5]: Supabase 프로젝트 설정이 아직 연결되지 않았습니다. 새 프로젝트와 Google 로그인을 설정한 뒤 프로젝트 URL과 publishable key를 로컬 환경 파일에 넣어 주세요.
    - list [ref=e6]:
      - listitem [ref=e7]: Supabase Dashboard에서 새 프로젝트를 만들고 데이터베이스 암호를 따로 보관합니다.
      - listitem [ref=e8]: Project Settings → API에서 Project URL과 publishable key를 확인합니다.
      - listitem [ref=e9]: Authentication → Sign In / Providers에서 Google 로그인을 켜고 Supabase callback URL을 Google Cloud OAuth 설정에 등록합니다.
      - listitem [ref=e10]: Authentication → URL Configuration에 로컬 개발 주소와 배포 도메인을 추가합니다.
      - listitem [ref=e11]:
        - code [ref=e12]: supabase/migrations
        - text: 의 초기 SQL을 SQL Editor에서 실행해 테이블, RLS 정책, 저장 함수를 준비합니다.
      - listitem [ref=e13]:
        - code [ref=e14]: .env.example
        - text: 을
        - code [ref=e15]: .env.local
        - text: 로 복사하고 아래 환경변수에 프로젝트 값을 입력합니다.
      - listitem [ref=e16]:
        - text: "개발 서버를 다시 시작합니다:"
        - code [ref=e17]: pnpm dev
    - code [ref=e19]: NEXT_PUBLIC_SUPABASE_URL= NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=
    - paragraph [ref=e20]:
      - text: 브라우저에는 publishable key만 사용합니다.
      - code [ref=e21]: service_role
      - text: 키와 데이터베이스 암호를 넣지 마세요. 데이터 접근은 로그인 사용자별 RLS 정책으로 제한하며,
      - code [ref=e22]: .env.local
      - text: 은 저장소에 커밋하지 마세요.
