function eventForm(e,date,at){const editing=!!e;openInspector('form',e?.id||'event');document.getElementById('inspkind').textContent=editing?'일정 편집':'새 일정';document.getElementById('inspbody').innerHTML=`<div class="inspcat">${editing?'EDIT':'NEW'} EVENT</div><h2 class="insptitle">${editing?'일정 수정':'일정 추가'}</h2><p class="inspdesc">시간이 정해진 수업·약속·세미나를 등록합니다.</p><form onsubmit="saveEventForm(event,'${editing?safeId(e.id):''}')"><label class="formlabel">일정 이름<input name="title" required maxlength="100" class="field" value="${esc(e?.title||'')}"/></label><label class="formlabel">날짜<input name="date" type="date" required class="field" value="${e?.date||date||selected}"/></label><div class="fieldrow"><label class="formlabel">시작<input name="start" type="time" required class="field" value="${e?.start||at||'09:00'}"/></label><label class="formlabel">종료<input name="end" type="time" required class="field" value="${e?.end||String(Math.min(23,Number((at||'09:00').slice(0,2))+1)).padStart(2,'0')+':'+(at||'09:00').slice(3)}"/></label></div><label class="formlabel">반복<select name="repeat" class="field" onchange="document.getElementById('repeatUntilLabel').style.display=this.value?'block':'none'"><option value="">반복 안 함</option><option value="매주" ${e?.repeat?'selected':''}>매주 같은 요일</option></select></label><label class="formlabel" id="repeatUntilLabel" style="display:${e?.repeat?'block':'none'}">반복 종료일<input name="until" type="date" class="field" value="${e?.repeatUntil||'2026-12-15'}"/></label><label class="formlabel">분류<select name="group" class="field">${['학교','연구','개인'].map(x=>`<option ${e?.group===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="formlabel" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="progress" ${e?.showInProgressSummary?'checked':''} />이 일정을 Progress에도 표시</label><label class="formlabel">관련 URL<input name="url" type="url" placeholder="https://" class="field" value="${esc(e?.sourceUrl||'')}"/></label><label class="formlabel">메모<textarea name="notes" class="field" rows="3">${esc(e?.notes||'')}</textarea></label><button type="submit" class="action widebutton">${editing?'일정 변경 저장':'일정 추가'}</button></form>${e?.repeat?'<p class="insptiny">편집 내용은 반복 일정 전체에 적용됩니다.</p>':''}`}
function newEvent(date,at){eventForm(null,date,at)}

function saveEventForm(evt,id){evt.preventDefault();const f=new FormData(evt.currentTarget),title=String(f.get('title')||'').trim(),date=String(f.get('date')),start=String(f.get('start')),end=String(f.get('end')),repeat=String(f.get('repeat')||''),until=String(f.get('until')||'');if(!title||!date||!start||!end)return;if(end<=start){showToast('종료 시각은 시작 시각 이후여야 합니다');return;}if(repeat&&until<date){showToast('반복 종료일을 확인하세요');return;}let e=id?fixedEvents.find(x=>x.id===id):null;if(!e){e={id:uniqueId('e')};fixedEvents.push(e)}Object.assign(e,{title,date,start,end,group:String(f.get('group')),notes:String(f.get('notes')||''),sourceUrl:String(f.get('url')||''),showInProgressSummary:f.get('progress')==='on',repeat:repeat?`매주 ${WEEK[parse(date).getDay()]}요일`:undefined,repeatUntil:repeat?until:undefined});persistV4();repaintV4();openEvent(e.id,date);showToast('일정을 저장했습니다')}
function askDelete(kind,id){const target=kind==='task'?tasks.find(t=>t.id===id):kind==='event'?fixedEvents.find(e=>e.id===id):periods.find(p=>p.id===id);if(!target)return;const body=document.getElementById('inspbody');body.querySelector('#confirmdelete')?.remove();body.insertAdjacentHTML('beforeend',`<div class="confirmrow" id="confirmdelete"><strong>${esc(target.title)}</strong> 항목을 삭제할까요? ${kind==='period'?'연결된 할 일은 보존되고 연결만 해제됩니다.':''}<div class="rowflex" style="margin-top:13px"><button class="softbtn" onclick="document.getElementById('confirmdelete').remove()">취소</button><button class="softbtn danger-action" onclick="deleteRecord('${kind}','${safeId(id)}')">정말 삭제</button></div></div>`);body.scrollTop=body.scrollHeight}
function deleteRecord(kind,id){if(kind==='task'){let i=tasks.findIndex(x=>x.id===id);if(i<0)return;tasks.splice(i,1)}if(kind==='event'){let i=fixedEvents.findIndex(x=>x.id===id);if(i<0)return;fixedEvents.splice(i,1)}if(kind==='period'){let i=periods.findIndex(x=>x.id===id);if(i<0)return;periods.splice(i,1);tasks.filter(t=>t.period===id).forEach(t=>{t.period=null;t.step=undefined})}persistV4();closeInspector();repaintV4();showToast('항목을 삭제했습니다')}
function openSearch(){openInspector('search','global');document.getElementById('inspkind').textContent='전체 검색 · ⌘K';document.getElementById('inspbody').innerHTML=`<div class="inspcat">GLOBAL SEARCH</div><h2 class="insptitle">검색</h2><label class="formlabel">할 일 · 일정 · Progress<input id="searchBox" class="field" placeholder="제목 또는 메모 검색…" oninput="renderSearch(this.value)" autocomplete="off"/></label><div id="searchResults"></div>`;renderSearch('');setTimeout(()=>document.getElementById('searchBox')?.focus(),30)}
function renderSearch(q){q=String(q||'').trim().toLowerCase();const results=[...tasks.map(x=>({...x,kind:'task',label:'할 일'})),...periods.map(x=>({...x,kind:'period',label:'Progress'})),...fixedEvents.map(x=>({...x,kind:'event',label:'일정'}))].filter(x=>!q||(x.title+' '+(x.notes||'')+' '+(x.desc||'')).toLowerCase().includes(q)).slice(0,25);document.getElementById('searchResults').innerHTML=results.map(x=>`<button class="search-result" onclick="searchNavigate('${x.kind}','${safeId(x.id)}')"><strong>${esc(x.title)}</strong><span>${x.label} · ${esc(x.date||x.end||x.start||'')}</span></button>`).join('')||'<p class="empty">검색 결과가 없습니다.</p>'}
function searchNavigate(kind,id){if(kind==='task'){const t=tasks.find(x=>x.id===id);if(t){selected=t.date;miniCursor=new Date(parse(selected).getFullYear(),parse(selected).getMonth(),1);setView('today');renderToday();openTask(id)}}else if(kind==='period'){setView('progress');openPeriod(id)}else{let e=fixedEvents.find(x=>x.id===id);if(e){openCalOn('day',e.date);openEvent(id,e.date)}}}
function openSettings(tab='general'){settingsTab=tab;openInspector('settings',tab);document.getElementById('inspkind').textContent='설정 · 로컬 데모';document.getElementById('inspbody').innerHTML=`<div class="inspcat">PREFERENCES</div><h2 class="insptitle">설정</h2><div class="setting-tabs">${[['general','화면'],['calendar','캘린더'],['data','데이터']].map(x=>`<button class="${settingsTab===x[0]?'active':''}" onclick="openSettings('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="settingContent"></div>`;
const box=document.getElementById('settingContent');if(tab==='general'){box.innerHTML=`<div class="settings-section"><h3>강조 색상</h3><div class="rowflex" style="flex-wrap:wrap">${[['#346753','세이지'],['#2C698D','아크틱'],['#8F5A73','로즈'],['#9D6700','앰버']].map(x=>`<button class="softbtn" style="border-color:${x[0]};color:${x[0]}" onclick="setPreference('accent','${x[0]}')">● ${x[1]}</button>`).join('')}</div></div><div class="settings-section"><h3>알림</h3><label class="rowflex" style="cursor:pointer"><input type="checkbox" ${demoPrefs.notification?'checked':''} onchange="setPreference('notification',this.checked)"/> 알림 사용 설정</label><p class="insptiny">실제 운영 체제의 예약 알림은 아직 연결되지 않았습니다. 시안에서는 선택 사항을 저장합니다.</p></div><div class="notice">이 프로토타입은 기존 GitHub 앱과 달리 서버 계정 동기화를 하지 않습니다. 데모 데이터는 가능한 경우 이 브라우저의 로컬 저장소에 보관됩니다.</div>`}
if(tab==='calendar'){box.innerHTML=`<label class="formlabel">한 주의 시작<select class="field" onchange="setPreference('weekStart',Number(this.value))"><option value="1" ${demoPrefs.weekStart===1?'selected':''}>월요일</option><option value="0" ${demoPrefs.weekStart===0?'selected':''}>일요일</option></select></label><label class="formlabel">시각 표기<select class="field" onchange="setPreference('timeFormat',this.value)"><option value="24" ${demoPrefs.timeFormat==='24'?'selected':''}>24시간 표기</option><option value="12" ${demoPrefs.timeFormat==='12'?'selected':''}>오전/오후 12시간 표기</option></select></label><label class="formlabel">시간표 표시 범위<select class="field" onchange="setPreference('visibleHours',this.value)"><option value="8-20" ${demoPrefs.visibleHours==='8-20'?'selected':''}>08:00–20:00</option><option value="7-19" ${demoPrefs.visibleHours==='7-19'?'selected':''}>07:00–19:00</option><option value="9-21" ${demoPrefs.visibleHours==='9-21'?'selected':''}>09:00–21:00</option></select></label><label class="formlabel">시간대<select class="field" onchange="setPreference('timezone',this.value)"><option value="Asia/Seoul" ${demoPrefs.timezone==='Asia/Seoul'?'selected':''}>서울 (Asia/Seoul)</option><option value="Asia/Tokyo" ${demoPrefs.timezone==='Asia/Tokyo'?'selected':''}>도쿄 (Asia/Tokyo)</option><option value="UTC" ${demoPrefs.timezone==='UTC'?'selected':''}>UTC</option></select></label><div class="notice">시간대는 시안의 표시 선호도로 저장됩니다. 실제 시각 변환·DST 정합성은 기존 프로젝트의 시간 처리 계층에서 검증해야 합니다.</div>`}
if(tab==='data'){box.innerHTML=`<div class="settings-section"><h3>로컬 데이터</h3><p class="insptiny">현재 ${tasks.length}개 할 일 · ${periods.length}개 Progress · ${fixedEvents.length}개 일정</p><button class="softbtn widebutton" onclick="exportData()">JSON 백업 다운로드</button><label class="formlabel">JSON 백업 가져오기<input class="field" type="file" accept=".json,application/json" onchange="importData(event)"/></label><button class="softbtn widebutton danger-action" onclick="confirmReset()">데모 데이터 초기화</button></div><div class="notice">GitHub 앱의 Supabase/Google 로그인 동기화는 이 독립 HTML 프로토타입에서 동작하지 않습니다. 가져온 데이터는 현재 브라우저에서만 확인할 수 있습니다.</div>`}
}
function setPreference(key,value){demoPrefs[key]=value;window.demoPrefs=demoPrefs;persistV4();repaintV4();openSettings(settingsTab);showToast('설정을 저장했습니다')}
function exportData(){const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),periods,tasks,events:fixedEvents,prefs:demoPrefs},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='todo-macos-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);showToast('JSON 백업을 다운로드했습니다')}
async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!Array.isArray(data.periods)||!Array.isArray(data.events))throw Error('필수 컬렉션이 없습니다');if([...data.tasks,...data.periods,...data.events].some(x=>!x||typeof x.title!=='string'||typeof x.id!=='string'))throw Error('올바르지 않은 항목');if(!confirm('현재 데모 데이터를 백업 파일의 데이터로 교체할까요?'))return;tasks.splice(0,tasks.length,...data.tasks);periods.splice(0,periods.length,...data.periods);fixedEvents.splice(0,fixedEvents.length,...data.events);demoPrefs={...demoPrefs,...data.prefs};window.demoPrefs=demoPrefs;persistV4();repaintV4();openSettings('data');showToast('데이터를 가져왔습니다')}catch(err){showToast('백업을 읽을 수 없습니다: '+err.message)}}

function miniMoveDays(yr,mon){const first=(new Date(yr,mon,1).getDay()-demoPrefs.weekStart+7)%7;return Array.from({length:42},(_,i)=>new Date(yr,mon,1-first+i))}
